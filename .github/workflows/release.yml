name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # runs only once the trusted publisher is set up on PyPI and PYPI_PUBLISH=true is set
  pypi:
    needs: dist
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            built: dist/lazyios.exe
            asset: lazyios-windows-x64.exe
          - os: macos-latest
            built: dist/lazyios
            asset: lazyios-macos-arm64
          - os: ubuntu-latest
            built: dist/lazyios
            asset: lazyios-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # exact versions from uv.lock, each checked against its hash
      - run: pip install uv==0.12.23
      - run: uv export --frozen --no-dev --extra build --no-emit-project -o locked.txt
      - run: pip install --require-hashes -r locked.txt
      - run: pip install --no-deps .
      - run: pyinstaller packaging/lazyios.spec --noconfirm
      - run: cp ${{ matrix.built }} ${{ matrix.asset }}
        shell: bash
      - run: ./${{ matrix.asset }} --version
        shell: bash
      - run: ./${{ matrix.asset }} --selftest
        shell: bash
      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.os }}
          path: ${{ matrix.asset }}

  release:
    needs: binaries
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: bin-*
          merge-multiple: true
          path: out/
      - run: cd out && sha256sum lazyios-* > SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: out/*
