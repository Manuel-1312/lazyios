version: 2
updates:
- package-ecosystem: uv
  directory: /
  schedule: {interval: weekly, day: monday}
  open-pull-requests-limit: 5
  groups:
    python-minor-patch:
      update-types: [minor, patch]
    majors:
      update-types: [major]
- package-ecosystem: github-actions
  directory: /
  schedule: {interval: weekly, day: monday}
  groups:
    actions:
      patterns: ['*']
